    .swiper-container {
      width: 100%;
    }

    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    
    .swiper-button-next,
    .swiper-button-prev {
      background: none;
      color: inherit;
      width: auto;
      height: auto;
      top: 50%;
      transform: translateY(-50%);
    }

    .swiper-button-next::after,
    .swiper-button-prev::after {
      display: none;
    }

    .swiper-button-next i,
    .swiper-button-prev i {
      font-size: 44px;
    }

    .swiper-button-next {
      right: 10px;
    }

    .swiper-button-prev {
      left: 10px;
    }
  </style>

<!-- Include Shoprocket JS -->
<script async src="https://cdn.shoprocket.io/loader.js"></script>

  <!-- Updated MutationObserver -->
  <script type="text/javascript">
    // Function to initialize Swiper
    function initializeSwiper() {
      if (window.swiperInitialized) return;
      window.swiperInitialized = true;
      console.log("Initializing Swiper...");

      // Initialize Swiper
      var swiper = new Swiper('.swiper-container', {
        slidesPerView: 1, // Number of slides to show
        spaceBetween: 10, // Space between slides in px
        loop: true, // Enable continuous loop mode
        autoHeight: true, // Enable auto height
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
      });
    }

    // MutationObserver to detect changes when Shoprocket iframes are loaded
    var observer = new MutationObserver(function(mutationsList, observer) {
      var allIframesLoaded = Array.from(document.querySelectorAll('.sr-products iframe'))
        .every(iframe => iframe.contentWindow && iframe.contentDocument);

      if (allIframesLoaded) {
        initializeSwiper(); // Initialize Swiper when all Shoprocket content is ready
        observer.disconnect(); // Stop observing once done
      }
    });

    // Start observing the document for added nodes
    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  </script>
